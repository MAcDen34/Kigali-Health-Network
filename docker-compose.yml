version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kuprin
      POSTGRES_PASSWORD: kuprin_dev
      POSTGRES_DB: kuprin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuprin -d kuprin"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  records-service:
    build: ./services/records-service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kuprin:kuprin_dev@postgres:5432/kuprin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/records-service:/app

volumes:
  pgdata: